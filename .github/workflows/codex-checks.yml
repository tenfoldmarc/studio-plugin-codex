name: Codex package and updater checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.143.0
      - name: Package and updater regression tests
        run: python -m unittest discover -s tests
      - name: Native Git marketplace install and update
        run: python tests/native_install_smoke.py
      - name: Install the customer's static FFmpeg package
        run: |
          python -m pip install "requests>=2,<3" "filelock>=3" progress==1.6.1
          python -m pip install --no-deps static-ffmpeg==3.0
      - name: Sideways phone zoom and twelve-cut lip sync regressions
        run: python ci/assembly_regression.py
      - name: Validate PowerShell starters
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
